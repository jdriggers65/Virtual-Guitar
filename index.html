<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Virtual Guitar</title>

    <link rel="stylesheet" href="style.css?v=0.6A-2">
</head>

<body>

    <main class="guitar-app">

        <!-- LEFT SIDE -->
        <section class="controls">

            <div class="key-control">

    <button class="key-button" id="key-up">▲</button>

    <div class="key-display">
        <span class="key-label">KEY</span>
        <span id="current-key">G</span>
    </div>

    <button class="key-button" id="key-down">▼</button>

</div>

<div class="chord-display">
    <span class="chord-label">CHORD</span>
    <span id="current-chord">G</span>
</div>

<button id="chord-mode-toggle">
    NUM
</button>

            <div class="chord-buttons">

                <button class="chord major selected" data-chord="G">
                    I
                </button>

                <button class="chord minor" data-chord="Am">
                    ii
                </button>

                <button class="chord minor" data-chord="Bm">
                    iii
                </button>

                <button class="chord major" data-chord="C">
                    IV
                </button>

                <button class="chord major" data-chord="D">
                    V
                </button>

                <button class="chord minor" data-chord="Em">
                    vi
                </button>

            </div>

            <div class="seventh-chord-buttons">
            <button class="chord seventh major" data-chord="Gmaj7">I7</button>
            <button class="chord seventh minor" data-chord="Am7">ii7</button>
            <button class="chord seventh minor" data-chord="Bm7">iii7</button>
            <button class="chord seventh major" data-chord="Cmaj7">IV7</button>
            <button class="chord seventh major" data-chord="D7">V7</button>
            <button class="chord seventh minor" data-chord="Em7">vi7</button>
</div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="guitar">

            <div class="soundhole"></div>

            <div class="string" data-string="1"></div>
            <div class="string" data-string="2"></div>
            <div class="string" data-string="3"></div>
            <div class="string" data-string="4"></div>
            <div class="string" data-string="5"></div>
            <div class="string" data-string="6"></div>

        </section>

    </main>

    <script src="./app.js?v=0.6A-2"></script>

</body>
<div class="build-version">TEST 0.6A-2</div>

</html>
